<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CSM Synergy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #3d3672;
      --teal: #1b7895;
      --mint: #75e6da;
      --sky: #dbeaff;
      --off-white: #f8faff;
      --font-display: 'Play', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--teal) 0%, var(--purple) 100%);
      font-family: var(--font-body);
      color: #fff;
      text-align: center;
    }
    .card { max-width: 34rem; }
    .code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 700;
      line-height: 1;
      margin: 0;
      color: var(--mint);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      margin: 0.5rem 0 0.75rem;
    }
    p { margin: 0 0 2rem; font-size: 1.05rem; line-height: 1.6; color: var(--sky); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a.btn {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.primary { background: var(--mint); color: var(--purple); }
    a.secondary { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.35); }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>We couldn&rsquo;t find that page</h1>
    <p>The link may be out of date, or the page may have moved. Let&rsquo;s get you back on track.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn secondary" href="/contact">Contact us</a>
    </div>
  </div>
</body>
</html>
